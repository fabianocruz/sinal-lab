name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    services:
      # Some tests (e.g. health) exercise the real get_db dependency,
      # which expects the local-dev Postgres from docker compose.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sinal
          POSTGRES_PASSWORD: sinal_dev
          POSTGRES_DB: sinal_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sinal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/agents/requirements.txt
            packages/database/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r packages/database/requirements.txt \
            -r apps/agents/requirements.txt \
            -r apps/api/requirements.txt \
            -r requirements-dev.txt
      - name: Run tests
        env:
          DATABASE_URL: postgresql://sinal:sinal_dev@localhost:5432/sinal_dev
        run: python -m pytest apps/ packages/ scripts/tests -q

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Vitest
        run: pnpm --filter @sinal/web exec vitest run
      - name: Lint
        run: pnpm --filter @sinal/web lint
